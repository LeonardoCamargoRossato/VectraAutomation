name: Vectra Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: vectra-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: python code/scripts/validate_assets.py
        working-directory: .
      - run: npm test
      - run: npm run build
      - run: python code/scripts/lcr_naming.py --check
        working-directory: .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: code/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-publication:
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify public HTTP assets and actual browser
        run: node scripts/VerifyLive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PublicReleaseEvidence
          path: code/test-results/LiveRelease/*.png
          if-no-files-found: warn
          retention-days: 14
