name: Vectra Quality Gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python code/scripts/lcr_naming.py --check
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config PlaywrightConfig.js
      - run: npm audit --audit-level=high
