name: Vectra Quality Gate
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: vectra-quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: python code/scripts/validate_assets.py
        working-directory: .
      - run: npm test
      - run: npm run build
      - run: python code/scripts/lcr_naming.py --check
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - name: V7 header, Home, compatibility and baseline screenshots
        run: |
          git worktree add --detach "$RUNNER_TEMP/vectra-baseline" 21e8f583231d8e54af142d6c449ac6fe8ff0c93e
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/vectra-baseline/code/node_modules"
          (cd "$RUNNER_TEMP/vectra-baseline/code" && npm run dev -- --port 5174) > "$RUNNER_TEMP/vectra-baseline.log" 2>&1 &
          BASE_PID=$!
          trap 'kill "$BASE_PID" 2>/dev/null || true; git worktree remove --force "$RUNNER_TEMP/vectra-baseline"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5174/VectraAutomation/ >/dev/null && break; sleep 1; done
          VECTRA_BASELINE_URL=http://127.0.0.1:5174/VectraAutomation/ npx playwright test --config PlaywrightConfig.js IdentityV7.spec.js --output test-results/IdentityV7
      - name: Production asset routing and stock smoke test
        run: VECTRA_PRODUCTION=1 npx playwright test --config PlaywrightConfig.js AssetArchitecture.spec.js --output test-results/AssetArchitecture
      - name: Browser navigation, capture and mobile
        run: npx playwright test --config PlaywrightConfig.js Browser.spec.js --output test-results/Browser
      - name: Stock model and undo
        run: npx playwright test --config PlaywrightConfig.js StockModel.spec.js --output test-results/Stock
      - name: Environment and capture persistence
        run: npx playwright test --config PlaywrightConfig.js EnvironmentExperience.spec.js --output test-results/Environment
      - name: Garage persistence and camera boundaries
        run: npx playwright test --config PlaywrightConfig.js Garage.spec.js --output test-results/Garage
      - name: Private photo references and interior detail
        run: npx playwright test --config PlaywrightConfig.js PhotoReference.spec.js --output test-results/PhotoReference
      - name: V6.3 stock first frame and connected cabin
        run: npx playwright test --config PlaywrightConfig.js CabinHotfix.spec.js --output test-results/CabinHotfix
      - name: Published reference photo delivery
        run: npx playwright test --config PlaywrightConfig.js PublishedReferences.spec.js --output test-results/PublishedReferences
      - name: Prepared private photographic dataset
        run: npx playwright test --config PlaywrightConfig.js PreparedDataset.spec.js --output test-results/PreparedDataset
      - name: Comparative visual evidence
        run: npx playwright test --config PlaywrightConfig.js AutomotiveVisual.spec.js --output test-results/Visual
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AutomotiveVisualEvidence
          path: code/test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14
