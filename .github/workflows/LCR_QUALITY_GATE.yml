name: Vectra Quality Gate
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: vectra-quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  stock-diagnostic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: node --test tests/InteriorStructure.test.js
  structural-visual:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Structural cabin V5.2 evidence
        run: npx playwright test --config PlaywrightConfig.js InteriorStructure.spec.js --output test-results/InteriorStructure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: InteriorStructuralEvidence
          path: |
            code/test-results/InteriorStructure/**/*.png
            code/test-results/InteriorStructure/**/StructureReport.json
          if-no-files-found: warn
          retention-days: 14
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python code/scripts/lcr_naming.py --check
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - name: Browser navigation, capture and mobile
        run: npx playwright test --config PlaywrightConfig.js Browser.spec.js --output test-results/Browser
      - name: Stock model and undo
        run: npx playwright test --config PlaywrightConfig.js StockModel.spec.js --output test-results/Stock
      - name: Environment and capture persistence
        run: npx playwright test --config PlaywrightConfig.js EnvironmentExperience.spec.js --output test-results/Environment
      - name: Garage persistence and camera boundaries
        run: npx playwright test --config PlaywrightConfig.js Garage.spec.js --output test-results/Garage
      - name: Private photo references and interior detail
        run: npx playwright test --config PlaywrightConfig.js PhotoReference.spec.js --output test-results/PhotoReference
      - name: Published reference photo delivery
        run: npx playwright test --config PlaywrightConfig.js PublishedReferences.spec.js --output test-results/PublishedReferences
      - name: Comparative visual evidence
        if: ${{ !cancelled() }}
        run: npx playwright test --config PlaywrightConfig.js AutomotiveVisual.spec.js --output test-results/Visual
      - run: npm audit --audit-level=high
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AutomotiveVisualEvidence
          path: |
            code/test-results/**/*.png
            code/test-results/**/StructureReport.json
          if-no-files-found: warn
          retention-days: 14
